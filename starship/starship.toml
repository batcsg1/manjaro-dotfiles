"$schema" = 'https://starship.rs/config-schema.json'

# Neon Green — matches kitty.conf / waybar
# Void    #0A0F0A #0F1710 #17261A #2F4A35
# Haze    #C6F5CE #DDFFE3 #F2FFF4
# Neon    #00FFC8 #39FF14 #76FF3C #0ABF53
# Signal  #FF2D55 #FFB31A #D7FF1A #00FF85 #00E5A0

palette = 'neon'

add_newline = true

format = """
[┌](bold fg:neon10)$os$shell$username$hostname$time
[└](bold fg:neon8)$directory$git_branch$git_status
$character"""

# ── line 1: os / shell / user / host / time ──────────────────────

[os]
disabled = false
format = '[ $symbol \($type\) ](bold bg:neon10 fg:neon6)'

[os.symbols]
Debian  = "󰣚"
Ubuntu  = ""
Arch    = ""
CachyOS = ""
Fedora  = ""
Windows = ""
Macos   = ""
Linux   = ""
Manjaro = "󱘊 "

[shell]
disabled = false
bash_indicator = 'bash'
zsh_indicator = 'zsh'
fish_indicator = 'fish'
powershell_indicator = 'pwsh'
unknown_indicator = 'sh'
format = '[](bg:neon9 fg:neon10)[   $indicator ](bold bg:neon9 fg:neon0)'

[username]
show_always = true
style_user = 'bold bg:neon8 fg:neon0'
style_root = 'bold bg:neon8 fg:neon11'
format = '[](bg:neon8 fg:neon9)[ $user/]($style)'

[hostname]
ssh_only = false
format = '[$hostname ](bold bg:neon8 fg:neon0)'

[time]
disabled = false
time_format = '%H:%M'
format = '[](bg:neon7 fg:neon8)[   $time ](bold bg:neon7 fg:neon0)[](fg:neon7)'

# ── line 2: directory + git ──────────────────────────────────────

[directory]
format = '[\[ ](fg:neon3)[$path](bold fg:neon8)[$read_only](fg:neon11)[ \]](fg:neon3)'
read_only = ' 󰌾'
truncation_length = 3
truncate_to_repo = false
truncation_symbol = '…/'
home_symbol = '~'

[git_branch]
symbol = ' '
format = ' [$symbol$branch](bold fg:neon15)'

[git_status]
format = '[ $all_status$ahead_behind](fg:neon13)'

# ── line 3: prompt char ──────────────────────────────────────────

[character]
success_symbol = '[❯](bold fg:neon10)[❯](bold fg:neon9)[❯](bold fg:neon8)'
error_symbol = '[❯❯❯](bold fg:neon11)'
vimcmd_symbol = '[❮](bold fg:neon15)'

# ── palette (must stay last: TOML tables swallow keys below them) ──

[palettes.neon]
neon0  = '#0A0F0A'
neon1  = '#0F1710'
neon2  = '#17261A'
neon3  = '#2F4A35'
neon4  = '#C6F5CE'
neon6  = '#F2FFF4'
neon7  = '#00FFC8'
neon8  = '#39FF14'
neon9  = '#76FF3C'
neon10 = '#0ABF53'
neon11 = '#FF2D55'
neon12 = '#FFB31A'
neon13 = '#D7FF1A'
neon14 = '#00FF85'
neon15 = '#00E5A0'
