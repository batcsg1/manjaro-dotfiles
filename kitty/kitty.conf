# Neon Green — matches waybar / starship / btop / wofi / rofi / nvim
# Void        #0A0F0A #0F1710 #17261A #2F4A35
# Haze        #C6F5CE #DDFFE3 #F2FFF4
# Neon        #00FFC8 #39FF14 #76FF3C #0ABF53
# Signal      #FF2D55 #FFB31A #D7FF1A #00FF85 #00E5A0

background            #0A0F0A
background_opacity    0.85
foreground            #C6F5CE

cursor                #39FF14
cursor_text_color     #0A0F0A
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_trail_color    #76FF3C

selection_background  #17261A
selection_foreground  #F2FFF4

url_color             #39FF14
url_style             curly

# Window borders
window_border_width   1.5pt
active_border_color   #39FF14
inactive_border_color #0F1710
bell_border_color     #FF2D55

# Tab bar
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_background      #0A0F0A
active_tab_background   #39FF14
active_tab_foreground   #0A0F0A
active_tab_font_style   bold
inactive_tab_background #0F1710
inactive_tab_foreground #2F4A35

# black
color0  #17261A
color8  #2F4A35

# red
color1  #FF2D55
color9  #FF5C7A

# green
color2  #39FF14
color10 #76FF3C

# yellow
color3  #D7FF1A
color11 #E8FF5C

# blue
color4  #00B36B
color12 #00E58A

# magenta
color5  #A8FF00
color13 #C6FF4D

# cyan
color6  #00FFC8
color14 #5CFFD9

# white
color7  #C6F5CE
color15 #F2FFF4

# Fonts
font_family      DepartureMono Nerd Font Mono
bold_font        DepartureMono Nerd Font Mono
italic_font      DepartureMono Nerd Font Mono
bold_italic_font DepartureMono Nerd Font Mono
font_size        6

# Fall back to the symbols font for Nerd Font glyphs (fixes tofu boxes)
# needs: sudo pacman -S ttf-nerd-fonts-symbols-mono
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font Mono

# Remote control (was for rgb-cycle.sh; safe to remove if unused)
allow_remote_control socket-only
listen_on            unix:/tmp/kitty

# Keybinds
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+f5 load_config_file
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
